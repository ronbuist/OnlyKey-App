<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- KeyBar app icon. Original artwork for this fork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A50"/>
      <stop offset="1" stop-color="#141A26"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55637C"/>
      <stop offset="1" stop-color="#424F66"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#EE9A1F"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- menu bar strip -->
    <rect x="100" y="100" width="824" height="170" fill="url(#bar)"/>
    <rect x="100" y="268" width="824" height="4" fill="#000" opacity="0.25"/>
    <!-- "menu items" on the bar -->
    <rect x="200" y="172" width="92" height="26" rx="13" fill="#C9D1DE" opacity="0.55"/>
    <rect x="316" y="172" width="64" height="26" rx="13" fill="#C9D1DE" opacity="0.55"/>
    <!-- the highlighted status item the key hangs from -->
    <rect x="608" y="150" width="140" height="70" rx="20" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- key on a small ring, hanging from the status item like an open menu -->
  <g filter="url(#shadow)">
    <path fill="#E6EBF2" fill-rule="evenodd" d="M638 232 a40 40 0 1 0 80 0 a40 40 0 1 0 -80 0 Z M654 232 a24 24 0 1 0 48 0 a24 24 0 1 0 -48 0 Z"/>
    <g transform="translate(678 232) rotate(14)">
      <!-- bow -->
      <path fill="url(#key)" fill-rule="evenodd" d="M-140 175 a140 140 0 1 0 280 0 a140 140 0 1 0 -280 0 Z M-58 175 a58 58 0 1 0 116 0 a58 58 0 1 0 -116 0 Z"/>
      <!-- shaft and teeth -->
      <path fill="url(#key)" d="M-36 300 h72 v312 a14 14 0 0 1 -14 14 h-44 a14 14 0 0 1 -14 -14 Z
        M36 458 h74 a12 12 0 0 1 12 12 v36 a12 12 0 0 1 -12 12 h-74 Z
        M36 550 h54 a12 12 0 0 1 12 12 v36 a12 12 0 0 1 -12 12 h-54 Z"/>
    </g>
  </g>
</svg>
